name: Natives

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'natives/**'
      - 'native/**'
      - 'gradle.properties'
      - 'scripts/*natives*'
      - 'src/**'
      - '.github/workflows/natives.yml'
  pull_request:
    paths:
      - 'natives/**'
      - 'native/**'
      - 'gradle.properties'
      - 'scripts/*natives*'
      - '.github/workflows/natives.yml'

jobs:
  bundle:
    name: ${{ matrix.label }} bundle
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            label: Linux x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            label: Linux aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Read target Mapnik version
        run: echo "MAPNIK_VERSION=$(grep '^mapnik.version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      # Compiles Mapnik, builds the shim against it, and gathers everything into build/natives.
      # The layer cache keeps the long Mapnik compile for later runs.
      - name: Build the bundle
        uses: docker/build-push-action@v7
        with:
          context: .
          file: natives/linux/Dockerfile
          target: export
          build-args: |
            MAPNIK_VERSION=${{ env.MAPNIK_VERSION }}
            PLATFORM=${{ matrix.platform }}
          outputs: type=local,dest=build/natives
          cache-from: type=gha,scope=natives-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=natives-${{ matrix.platform }}

      - name: What was built
        run: |
          ls -la build/natives/${{ matrix.platform }} build/natives/${{ matrix.platform }}/lib | head -60
          du -sh build/natives/${{ matrix.platform }}
          cat build/natives/${{ matrix.platform }}/NOTICE

      # A clean Ubuntu with only a JDK: the integration tests must pass using nothing but the bundle.
      - name: Test on a machine with no Mapnik
        run: docker buildx build -f natives/linux/Dockerfile.test --build-arg PLATFORM=${{ matrix.platform }} --progress plain .

      - uses: actions/upload-artifact@v6
        with:
          name: natives-${{ matrix.platform }}
          path: build/natives
          retention-days: 14

  # The PostGIS add-on: the plugin must load from the add-on bundle, and on x86_64 draw a real table.
  postgis:
    name: PostGIS add-on (linux-x86_64, with a database)
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: actions/download-artifact@v7
        with:
          name: natives-linux-x86_64
          path: build/natives

      - name: Load the fixture table
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f natives/postgis-fixture.sql

      - name: Integration tests with the add-on bundle
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: ./gradlew integrationTest -PbundledNatives -PnativesPlatform=linux-x86_64 -PnativesExtras=postgis --tests '*Postgis*' --tests '*BundledNatives*'

  # ARM: no database here, so only check that the add-on loads and its libraries resolve.
  postgis-arm:
    name: PostGIS add-on (linux-aarch64, loading only)
    needs: bundle
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: actions/download-artifact@v7
        with:
          name: natives-linux-aarch64
          path: build/natives

      - name: Integration tests with the add-on bundle
        run: ./gradlew integrationTest -PbundledNatives -PnativesPlatform=linux-aarch64 -PnativesExtras=postgis --tests '*Postgis*' --tests '*BundledNatives*'

  # macOS has no containers: build on a Mac runner, with Homebrew supplying Mapnik's dependencies.
  macos:
    name: ${{ matrix.label }} bundle
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            label: macOS aarch64
            runner: macos-14
          - platform: macos-x86_64
            label: macOS x86_64
            runner: macos-15-intel

    steps:
      - uses: actions/checkout@v7

      - name: Read target Mapnik version
        run: echo "MAPNIK_VERSION=$(grep '^mapnik.version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Restore Mapnik
        id: mapnik-cache
        uses: actions/cache/restore@v6
        with:
          path: build/mapnik-prefix
          key: mapnik-${{ matrix.platform }}-${{ env.MAPNIK_VERSION }}-${{ hashFiles('natives/macos/build.sh') }}

      - name: Build Mapnik
        if: steps.mapnik-cache.outputs.cache-hit != 'true'
        run: STOP_AFTER_MAPNIK=1 natives/macos/build.sh ${{ matrix.platform }}

      - name: Save Mapnik
        if: steps.mapnik-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/mapnik-prefix
          key: mapnik-${{ matrix.platform }}-${{ env.MAPNIK_VERSION }}-${{ hashFiles('natives/macos/build.sh') }}

      - name: Build the shim and the bundle
        run: natives/macos/build.sh ${{ matrix.platform }}

      - name: What was built
        run: |
          ls -la build/natives/${{ matrix.platform }} build/natives/${{ matrix.platform }}/lib | head -80
          cat build/natives/${{ matrix.platform }}/NOTICE

      - uses: actions/upload-artifact@v6
        with:
          name: natives-${{ matrix.platform }}
          path: build/natives
          retention-days: 14

  # A second, fresh Mac that never built anything: the integration tests must pass with the bundle alone.
  macos-test:
    name: ${{ matrix.label }} test
    needs: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            label: macOS aarch64
            runner: macos-14
          - platform: macos-x86_64
            label: macOS x86_64
            runner: macos-15-intel

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: actions/download-artifact@v7
        with:
          name: natives-${{ matrix.platform }}
          path: build/natives

      - name: Integration tests against the bundle
        run: ./gradlew integrationTest -PbundledNatives -PnativesPlatform=${{ matrix.platform }}

  # Windows has no containers either: Visual Studio's compiler and vcpkg for the dependencies, as in Mapnik's
  # own Windows CI. The first run builds every dependency from source and takes hours; the vcpkg binary cache
  # and the Mapnik install are cached for the runs after.
  windows:
    name: Windows x86_64 bundle
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      PLATFORM: windows-x86_64

    steps:
      - uses: actions/checkout@v7

      - name: Read target Mapnik version
        run: echo "MAPNIK_VERSION=$(grep '^mapnik.version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Tools
        run: |
          pip install pefile
          for attempt in 1 2 3; do choco install --yes --no-progress ninja && ninja --version && break; sleep 10; done

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: build/vcpkg-binary-cache
          key: vcpkg-windows-${{ env.MAPNIK_VERSION }}-${{ hashFiles('natives/windows/build.sh') }}
          restore-keys: |
            vcpkg-windows-${{ env.MAPNIK_VERSION }}-

      - name: Build the dependencies
        run: STOP_AFTER=deps natives/windows/build.sh ${{ env.PLATFORM }}

      # Saved right away, so a later failure does not throw hours of dependency builds away.
      - name: Save the vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Restore Mapnik
        id: mapnik-cache
        uses: actions/cache/restore@v6
        with:
          path: build/mapnik-prefix
          key: mapnik-windows-${{ env.MAPNIK_VERSION }}-${{ hashFiles('natives/windows/build.sh') }}

      - name: Build Mapnik
        if: steps.mapnik-cache.outputs.cache-hit != 'true'
        run: STOP_AFTER=mapnik natives/windows/build.sh ${{ env.PLATFORM }}

      - name: Save Mapnik
        if: steps.mapnik-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/mapnik-prefix
          key: mapnik-windows-${{ env.MAPNIK_VERSION }}-${{ hashFiles('natives/windows/build.sh') }}

      - name: Build the shim and the bundle
        run: natives/windows/build.sh ${{ env.PLATFORM }}

      - name: What was built
        run: |
          ls -la build/natives/${{ env.PLATFORM }} build/natives/${{ env.PLATFORM }}/lib | head -80
          cat build/natives/${{ env.PLATFORM }}/NOTICE

      - uses: actions/upload-artifact@v6
        with:
          name: natives-${{ env.PLATFORM }}
          path: build/natives
          retention-days: 14

  # A second, fresh Windows machine that built nothing: the integration tests must pass with the bundle alone.
  windows-test:
    name: Windows x86_64 test
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: actions/download-artifact@v7
        with:
          name: natives-windows-x86_64
          path: build/natives

      - name: Integration tests against the bundle
        run: ./gradlew integrationTest -PbundledNatives -PnativesPlatform=windows-x86_64
