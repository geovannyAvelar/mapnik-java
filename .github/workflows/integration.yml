name: Integration

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'src/**'
      - 'examples/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/integration.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'src/**'
      - 'examples/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/integration.yml'

jobs:
  integration:
    name: Mapnik integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Read target Mapnik version
        run: echo "MAPNIK_VERSION=$(grep '^mapnik.version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Install Mapnik build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libicu-dev libfreetype6-dev libharfbuzz-dev libxml2-dev libjpeg-dev \
            libtiff-dev libwebp-dev libcairo2-dev libproj-dev libgdal-dev \
            libboost-filesystem-dev libboost-program-options-dev libboost-regex-dev

      # Building Mapnik takes a while, so cache the installed tree per version.
      - name: Restore Mapnik
        id: mapnik-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/mapnik-install
          key: mapnik-${{ env.MAPNIK_VERSION }}-ubuntu-24.04-v1

      - name: Build Mapnik ${{ env.MAPNIK_VERSION }}
        if: steps.mapnik-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch "v$MAPNIK_VERSION" --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/mapnik/mapnik.git "$RUNNER_TEMP/mapnik"
          cd "$RUNNER_TEMP/mapnik"
          cmake --preset linux-ci-release
          cmake --build --preset linux-ci-release
          cmake --install build --prefix "$HOME/mapnik-install"

      # Save right away, so a later failure does not throw the build away.
      - name: Save Mapnik
        if: steps.mapnik-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/mapnik-install
          key: mapnik-${{ env.MAPNIK_VERSION }}-ubuntu-24.04-v1

      # A CMake-installed Mapnik has no mapnik-config: point CMake at its package
      # config and find the input plugins by looking for a known one.
      - name: Point the build at Mapnik
        run: |
          PREFIX="$HOME/mapnik-install"
          PLUGIN="$(find "$PREFIX" -name 'csv.input' | head -1)"
          test -n "$PLUGIN" || { echo "no input plugins under $PREFIX"; find "$PREFIX" -maxdepth 3 | head -50; exit 1; }
          echo "CMAKE_PREFIX_PATH=$PREFIX" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PREFIX/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "MAPNIK_INPUT_PLUGINS=$(dirname "$PLUGIN")" >> "$GITHUB_ENV"
          echo "plugins: $(dirname "$PLUGIN")"
          ls "$(dirname "$PLUGIN")"

      - name: Build native shim
        run: |
          cmake -S native -B build/cmake
          cmake --build build/cmake

      - run: chmod +x ./gradlew

      - name: Unit tests (run for real now)
        run: ./gradlew test

      - name: Integration tests
        run: ./gradlew integrationTest

      - name: Example app (consumes the library as a dependency)
        working-directory: examples/render-demo
        run: |
          chmod +x ./gradlew
          ./gradlew test run --args="$RUNNER_TEMP/world.png"
          file "$RUNNER_TEMP/world.png"

      - name: WMS example
        working-directory: examples/wms-server
        run: |
          chmod +x ./gradlew
          ./gradlew test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests
