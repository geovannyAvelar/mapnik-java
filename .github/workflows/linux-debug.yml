name: Linux dependencies (debug)

# Throwaway: runs only the Linux dependency build, to see why a port fails. Delete when done.
on:
  workflow_dispatch:

jobs:
  deps:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: build/vcpkg-binary-cache
          key: vcpkg-${{ matrix.platform }}-debug-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ matrix.platform }}-
      - name: Build the dependencies
        run: STOP_AFTER=deps natives/linux/build-manylinux.sh ${{ matrix.platform }}
      - name: Save the vcpkg binary cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: build/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Keep vcpkg's logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: vcpkg-logs-${{ matrix.platform }}
          path: build/mapnik-src/vcpkg/buildtrees/*/*.log
          retention-days: 7
