name: Javadoc

# Publishes the API documentation to GitHub Pages: https://geovannyavelar.github.io/mapnik-java/
# Enable it once in the repository settings: Pages, Source: GitHub Actions.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/main/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - run: chmod +x ./gradlew

      - name: Generate Javadoc
        run: ./gradlew javadoc

      # The API pages, with an index that also links the guides, which GitHub renders from the repository.
      - name: Assemble the site
        run: |
          mkdir -p site/api
          cp -r build/docs/javadoc/. site/api/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>mapnik-java</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>body{font:16px/1.5 system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem}</style>
          <h1>mapnik-java</h1>
          <p>Java bindings for Mapnik.</p>
          <ul>
            <li><a href="api/">API documentation (Javadoc)</a></li>
            <li><a href="https://github.com/geovannyAvelar/mapnik-java/blob/main/docs/COOKBOOK.md">Cookbook</a></li>
            <li><a href="https://github.com/geovannyAvelar/mapnik-java/blob/main/docs/PERFORMANCE.md">Performance</a></li>
            <li><a href="https://github.com/geovannyAvelar/mapnik-java/blob/main/docs/RASTER.md">Raster data and GDAL</a></li>
            <li><a href="https://github.com/geovannyAvelar/mapnik-java/blob/main/docs/MIGRATION.md">Upgrading</a></li>
            <li><a href="https://github.com/geovannyAvelar/mapnik-java">Source and README</a></li>
          </ul>
          HTML

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
