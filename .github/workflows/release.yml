name: Release & Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'

jobs:
  # Publishing waits for the real-Mapnik tests: build Mapnik, run unit,
  # integration and example tests.
  integration:
    name: Integration tests
    uses: ./.github/workflows/integration.yml

  # The prebuilt native libraries, tested on a machine with no Mapnik before anything is published.
  natives:
    name: Native libraries
    uses: ./.github/workflows/natives.yml

  publish:
    name: Build, Sign & Publish
    needs: [integration, natives]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - run: chmod +x ./gradlew

      - name: Check tag matches project version
        run: |
          VERSION=$(./gradlew -q printVersion)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version v$VERSION"
            exit 1
          fi

      - name: Download the native bundle
        uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          merge-multiple: true
          path: build/natives

      - run: ./gradlew build

      - name: Publish to Maven Central (Sonatype Central Portal)
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew publishMavenJavaPublicationToCentralPortal publishNativesToCentralPortal
