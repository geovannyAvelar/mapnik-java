# Versioning: <mapnik version>.<wrapper revision>, e.g. 4.3.2.0
# Bump mapnik.version when moving to a new Mapnik release (and reset the revision to 0).
# Bump wrapper.revision for wrapper-only changes against the same Mapnik.
mapnik.version=4.3.2
wrapper.revision=0

# Project metadata
project.name=mapnik-java
project.description=Java bindings for Mapnik via a C shim and JNA
project.url=https://github.com/geovannyAvelar/mapnik-java

# Developer information
developer.id=avelar
developer.name=Giovani Avelar
developer.email=github@avelar.dev

org.gradle.parallel=true
org.gradle.caching=true
